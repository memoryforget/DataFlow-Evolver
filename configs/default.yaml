# DataFlow-Evolve 默认配置
# 支持 ${ENV_VAR} 或 ${ENV_VAR:default} 形式的环境变量展开（见 utils/config.py）

project:
  workspace_dir: ${DF_WORKSPACE_DIR:./workspace}
  agent_root: ${DF_AGENT_ROOT:./workspace/_agent_root}      # Agent SDK 的 cwd；内含 .claude/skills + dataflow 源码副本
  # 当前 PTB 官方测试配置默认不向 Agent 提供 input/ 语料：from-scratch 合成，避免把外部输入当作
  # benchmark 先验喂给搜索。若要做消融，可显式设置 PTB_INPUT_DIR/PTB_INPUT_ENTRY。
  input_dir: ${PTB_INPUT_DIR:}
  input_entry: ${PTB_INPUT_ENTRY:}
  data_links_dir: ""                       # 外部数据集下载目录（跨节点共享）；留空=<workspace>/data_links

# 非-SDK 模型后端
llm:
  backend: api                             # api | vllm
  api:                                     # 辅助 Agent（Profiler/Review/Diagnostic）用；可上更强模型
    api_url: http://123.129.219.111:3000/v1/chat/completions   # 完整端点：DataFlow APILLMServing_request 逐字 POST（base /v1 是 404）；非-SDK serving 会自动剥成 base 再由 openai 客户端补回
    model_name: gpt-5.5
    api_key: ${DF_API_KEY:}   # 通过环境变量注入；或直接写明文密钥（不推荐提交）
    max_workers: 100
  # 生成的 pipeline【算子运行时】LLM（数据合成用），与上面的辅助 Agent 解耦。
  # 按用途区分多个 serving：每个算子根据自身功能绑定对应 serving。
  # 省略的字段逐字段回退到 api 段；整段删掉=行为与旧版一致（全部用 api）。
  pipeline_llm:
    generation:                              # 题目/数据生成类算子
      model_name: gpt-4o
    reasoning:                               # 推理/解题/CoT 类算子
      model_name: gpt-4o
  vllm:
    hf_model_name_or_path: ${VLLM_MODEL:Qwen/Qwen2.5-7B-Instruct}
    tensor_parallel_size: 1

# RecipeAgent / PipelineAgent 使用的 agent runtime；两种实现共用相同业务层和产物契约。
agent_sdk:
  runtime: ${AGENT_RUNTIME:claude}          # claude|opencode；用于相同搜索配置下做 harness 消融
  model: claude-opus-4-8
  effort: max                              # Claude 努力/思考档位 low|medium|high(默认)|xhigh(仅Opus4.7)|max；
  permission_mode: bypassPermissions       # 无头自动化
  setting_sources: [project]               # 从 cwd/.claude 加载技能；技能由 SDK 自动发现，无需在此枚举
  max_turns: 50                            # 单次 SDK 运行最大轮数（MCP发现+读源码+写pipeline+自测修复，需要更多轮次）
  pipeline_filename: pipeline.py           # 约定：Agent 把流水线写到 <node_id>/pipeline.py
  recipe_mode: ${RECIPE_MODE:}             # 可选：external|hybrid|synthetic；非空时 prompt 与确定性校验器共同强制
  recipe_max_revisions: ${RECIPE_MAX_REVISIONS:2}  # recipe.json 被确定性校验器拒绝后的最大修订轮数
  # 瞬时错误（429/5xx/连接/超时）鲁棒性：指数退避重试 + 单次运行超时
  max_retries: ${AGENT_MAX_RETRIES:4}      # SDK 瞬时错误的最大尝试次数（含首次）；永久错误(CLI缺失/鉴权)不重试
  retry_base_delay: 10                     # 首次重试等待秒数，之后指数递增（10/20/40s...）
  run_timeout_sec: 1800                    # 单次 SDK 运行超时(秒)；超时按可重试错误处理，避免挂起时无限阻塞主循环
  resume_on_retry: true                    # 重试时若上次已建立会话则 resume 续跑(不重跑已完成的 turn)；上次没建起会话则全新重跑
  # OpenCode 仅在 runtime=opencode 时读取。OpenCode 原生发现 cwd 下现有的
  # .claude/skills/dataflow-dev，无需复制到 .opencode/skills。
  opencode:
    binary: ${OPENCODE_BIN:opencode}        # 可设为绝对路径；CLI 需单独安装
    model: ${OPENCODE_MODEL:}               # 留空沿用上面的 model，并自动补 provider/ 前缀
    provider: ${OPENCODE_PROVIDER:anthropic}
    api_key_env: ${OPENCODE_API_KEY_ENV:ANTHROPIC_API_KEY}  # 只记录变量名，key 不进入配置/命令行
    base_url: ${OPENCODE_BASE_URL:}         # 留空沿用 ANTHROPIC_BASE_URL
    variant: ${OPENCODE_VARIANT:}           # 可选 reasoning effort；留空沿用 agent_sdk.effort
    max_steps: ${OPENCODE_MAX_STEPS:50}
    mcp_timeout_ms: ${OPENCODE_MCP_TIMEOUT_MS:30000}  # local MCP 首次加载 DataFlow 依赖可能超过默认 5s
  # 外部数据搜索（默认关闭）：开启后挂载 dataset-search MCP，Agent 可在 HuggingFace 上
  # 搜索/预览/下载真实数据集到 project.data_links_dir，并在流水线里读取。
  # 是否允许引入外部数据属于实验设定的一部分，故须显式打开；开启时务必同时配好
  # review.decontamination.reference_files，否则很容易把 benchmark 的镜像数据集拉进来。
  external_data: true
  discovery: true                          # external_data 打开时是否连带挂 data-discovery（找线索）
  # 工具：用 claude_code 预设放开全部内置工具（见 llm/agent_sdk.py），不再设白名单
  # 系统提示：实现/修复阶段保留 claude_code 预设，仅 append DataFlow 指令；可用
  # system_prompt_append 覆盖。recipe 规划/修订阶段始终使用只允许写 recipe.json 的专属提示，
  # 避免通用实现提示诱导 Agent 提前生成 pipeline/operators。

# dataset-search MCP：取数（HuggingFace + ModelScope）。仅在 agent_sdk.external_data: true 时生效。
# 注意：这些工具是 in-process MCP，跑在编排器自己的进程里，**读不到 agent_sdk.env**
# （那一段是发给 Agent SDK 子进程的）。连接信息只能配在这里或直接 export。
dataset_search:
  endpoint: ${HF_ENDPOINT:https://hf-mirror.com}  # HF_ENDPOINT；默认走 HF-Mirror
  token: ""                       # HF_TOKEN；gated 数据集需要。留空=沿用环境变量/本地登录态
  cache_dir: ""                   # HF_HOME；留空=沿用环境（注意 datasets 的缓存也会占盘）
  max_download_mb: ${DATASET_MAX_DOWNLOAD_MB:8192}  # 单份数据集落盘上限；触顶截断（保留 split 头部）并在 meta 标明
  modelscope_endpoint: "https://modelscope.cn"         # MODELSCOPE_ENDPOINT；留空=https://modelscope.cn
  modelscope_token: ""            # MODELSCOPE_API_TOKEN；仅私有/受限数据集需要，公开数据集免登录
  # 下载默认取**整个 split**：取多少、怎么采样、按什么过滤本就是流水线该做的决策，也正是被
  # 搜索的对象；固化在工具里等于替搜索先做了一个它无从推翻的选择。只取单个 split 而非整仓库，
  # 是为了不把 test split 一起拖进来。
  # ModelScope 侧需装 external-data 依赖组；没装时那三个工具返回说明，不影响 HF 侧。

# data-discovery MCP：只找线索、不取数（网页 / GitHub / arXiv）。随 external_data 一起挂载，
# 可用 agent_sdk.discovery: false 单独关掉。凭据缺失只让对应那一个工具不可用，另外两个照常。
discovery:
  serper_api_key: ""              # search_web 用（付费）；留空=该工具返回说明，改用内置 WebSearch
  github_token: ""                # 留空=匿名搜索，GitHub 限流 10 次/分钟
  # search_papers 走 arXiv 公开 API，不需要任何凭据。

# 数据生成规模：注入生成 prompt，指导算子产出量（合成式据此设 num_samples，转换式控采样/过滤）
generation:
  target_samples: ${PTB_TARGET_SAMPLES:10000}  # 目标产出条数（0=不指定）；按下游 SFT 需求调，Condor 建议 <5000
  # 训练前把数据切齐到 target_samples 条（默认 true）。训练配方在框架外冻结，总优化步数
  # 正比于条数，不切齐则多产数据的节点白拿更多梯度步数，分数不再只反映数据质量。
  # 关掉它等于把"数据量"也放进搜索空间——想做"更多数据是否更好"的消融时才关。
  enforce_target_samples: true
  # probe_samples:（PostTrainBench 两段式新增，可选）搜索期每节点探针产出条数（如 200）。
  #   设置后 search.reward_source=review 时，搜索执行注入 DF_TARGET_SAMPLES=probe_samples，
  #   终选重产注入 DF_TARGET_SAMPLES=target_samples（同一 pipeline.py 复用两档规模）。默认未设=沿用 target_samples。

# Init node（node_0 = 树根）的启动方式，三档对应 docs/design-decisions.md §5.2 的独立性消融。
# 与其余节点同口径评分、无特殊地位；「相对初始流水线提升多少」在报告层用 score − node_0_score 算。
# 两项都可被命令行 --init-code / --init-instruction 覆盖。
init:
  reference_pipeline: ""          # 参考实现路径：给了就走「忠实改写」（不改数据处理逻辑，只搬到本框架契约下）
  instruction: ""                 # 自然语言构建指令；两项都留空 = 让 Agent 自主设计一条最小可行流水线

# MCTS 树搜索
search:
  # reward_source：每节点 reward 来源。当前 PTB 官方测试配置默认 train：
  #   每个通过 ReviewAgent 的 node 都跑 SFT + 官方 evaluate.py --limit N，取真分反馈 MCTS。
  #   review=Tier-1：每节点只产 generation.probe_samples 条交 ReviewAgent 打复合分作 reward
  #   （搜索期不训练/不占 GPU），搜索结束再对 top-K 重产 target_samples 做真实 SFT+评测选模。
  reward_source: ${PTB_REWARD_SOURCE:train}
  # 以下三项仅 reward_source=review 生效：
  # time_budget_sec:  整轮（搜索+终选+终评）总墙钟预算秒；0=只按 max_iterations 停。
  #                   搜索会预留「终选+终评」时间后停止扩展。
  # tier2_top_k:      终选按 tier1 取 top-K 做真实 SFT+评测（默认 3）；预算不足自动缩减（极端 K=1）。
  # tier2_per_run_sec / final_eval_reserve_sec: 单次 Tier-2 与终评的时间估计（默认取 train_timeout_sec），用于预算预留与 K 缩减。
  exploration_constant: 1.414
  exploration_decay: 1.0                    # 探索常数 c 的指数衰减率（按已评估节点数）；1.0=不衰减
  exploration_min: 0.0                      # 衰减下限，防 c 衰减到 0
  max_iterations: ${PTB_MAX_ITERATIONS:4}
  max_children_per_node: 2
  memory_top_k: 5                          # 注入 PipelineAgent prompt 的历史节点条数（按有效质量分降序：有下游真分用真分，否则用 tier1）
  memory_max_issues: 3                     # 每条记忆携带的评审 issues 条数（-1=全部，0=不带）
  memory_issue_maxlen: 120                 # 单条 issue 截断长度（<=0=不截断）
  recipe_memory_top_k: 5                   # RecipeContext 各类全局摘要最多保留条数
  recipe_compliance_threshold: 0.9         # 低于此合规度的下游分不得作为可信 recipe 收益证据
  self_correction_retries: ${PTB_SELF_CORRECTION_RETRIES:5}  # 流水线执行崩溃后的自修正重试次数
  review_self_correction_retries: ${PTB_REVIEW_RETRIES:5}    # Phase-1 评审打回后的自修正重试次数（看中间 step 产物定位、修复、重审）
  # Agent 基础设施失败熔断（区别于流水线质量失败：不惩罚节点、不消耗迭代预算）
  max_consecutive_infra_failures: 5        # 连续基础设施失败达到此数则主动终止（疑似代理/网络不可用）
  infra_backoff_sec: 30                    # 每次基础设施失败后、重试本轮前的退避秒数
  final_selection: ${PTB_FINAL_SELECTION:true}  # review 搜索结束后是否执行放大重产+SFT+终评；仅 smoke/debug 建议关闭
  checkpoint: ${DF_CHECKPOINT_PATH:./workspace/checkpoint.json}        # 断点续跑：非空=每轮落盘树状态到该路径，启动时存在则载入续跑；空=关闭

# Phase-1 快反馈：数据评审
review:
  # 评审只有**五个维度**（correctness / relevance / difficulty / diversity / schema），
  # 它们有两种互不相同的用法，别把下面的 *_threshold 当成额外维度：
  #   ① 连续分：五维按 weights 加权成 llm_composite，再乘硬指标惩罚 = tier1_score。
  #      review 模式下 tier1_score 就是 MCTS 的 reward。
  #   ② 通过门槛：passed 是布尔量，决定要不要触发自修正重来、要不要往下走训练。
  #      只有 schema 和 relevance 两维设门槛——字段对不上或跑题的数据，另外三维再高也没法用；
  #      而正确性/难度/多样性是质量梯度，低了该按比例扣分，不该一票否决。
  #
  # 与 configs/posttrainbench_gsm8k.yaml 同口径。注意：五维打分与硬指标**一直是开着的**
  # （ReviewAgent 的代码默认 hard_metrics=True、weights=下面这五个值、sample_size=80），
  # 此处写全只是让口径显式可见、便于两份配置对照，不改变行为。

  # ---- ① 连续分 ----
  weights:                        # 五维复合分固定权重
    correctness: 0.35
    relevance: 0.20
    difficulty: 0.15
    diversity: 0.15
    schema: 0.15
  hard_metrics: true              # 硬指标惩罚（dup_rate/null_rate/parse_valid_rate 扫全份文件）

  # ---- ② 通过门槛（另有两条硬否决：null_threshold 与下面的去污染 max_rate）----
  schema_threshold: 0.6           # schema 维低于此值判不通过
  relevance_threshold: 0.6        # relevance 维低于此值判不通过
  # trainer.dataset_schema 的关键字段空缺率一票否决线。字段名整体对不上时空缺率≈1，
  # 在这里拦下比等训练脚本报「数据集为空或字段不匹配」便宜一整轮 GPU。
  null_threshold: 0.5

  # ---- 抽样 ----
  sample_size: 80
  # 固定蓄水池采样种子。不设时（旧行为）连"同一份未改动文件的两次重评"抽样都不同，
  # 于是 passed 门槛带纯 RNG 噪声：边界节点可能靠换抽样而非靠修好数据通过。
  # 代价是固定切片有系统性偏差，抽 80 条可接受。硬指标扫全份文件，不受采样影响。
  sample_seed: 42
  # 终选安全阀：仅 search.reward_source=review 的 Tier-2 阶段生效（train 模式下 reward 已是
  # 真分，不走放大重产那条路）。留在这里是为了切换 reward_source 时不必再补一遍。
  collapse_dup_rate: 0.5          # 放大重产后 dup_rate 超过此值判质量塌陷（跳过用次优）
  collapse_null_rate: 0.3
  collapse_parse_valid_rate: 0.7
  collapse_tier1_frac: 0.6        # tier1 相对探针回退到此比例以下判塌陷
  # 去污染（见 core/decontamination.py）：合成数据与 PTB 官方测试题的 n-gram 重合检测。
  # PTB 规则禁止使用 benchmark test data 训练；默认 benchmark=gsm8k，因此参考集指向
  # 本仓库携带的 GSM8K test 镜像。更换 PTB_BENCHMARK 时同步设置 PTB_DECONTAM_REF。
  decontamination:
    reference_files:              # benchmark 测试集文件（jsonl/json/txt）；留空=不检测
      - ${PTB_DECONTAM_REF:data/benchmarks/limo_eval/gsm8k/test.jsonl}
    ngram: 13                     # 归一化后的 n-gram 长度；短文本退回整串精确匹配
    fields: []                    # 参与比对的字段；留空=该行所有字符串字段
    max_rate: 0.02                # 污染率上限，超过即判 passed=False（低于上限只按比例扣分）

# Phase-2 真实训练：外部脚本桥接
trainer:
  # train 环境的 python 路径（df-train；负责 SFT）
  # 留空则使用当前环境的 python
  train_python: /vepfs-mlp2/c20250602/500050/lh/xqf/miniconda3/envs/df-train/bin/python
  # eval 环境的 python 路径（df-eval；负责 vLLM benchmark 评测）
  # 留空则在 train 进程内直接评测（仅适合同环境开发/调试）
  eval_python: /vepfs-mlp2/c20250602/500050/lh/xqf/miniconda3/envs/df-eval/bin/python
  # 下游训练脚本实际读取的必需字段名——流水线产出的**权威契约**，会覆盖 TaskProfiler 的推断，
  # 并作为评审硬门槛（必需字段对不上在训练前就判不通过，见 review.null_threshold）。
  # 注意：这不是“只能有这些字段”。训练脚本只读取这些字段，额外元数据/溯源字段会被忽略。
  # 留空 = 让 LLM 自行设计字段名，对不上要到训练阶段才炸，且报错看不出根因是字段名。
  # 取值须与 PTB 桥接脚本的取字段逻辑一致：posttrainbench_sft_eval.py
  # 以 instruction/output 为首选键，兼容 question/answer/solution 等别名。
  dataset_schema:
    instruction: str                # 题面 / 指令
    output: str                     # 参考解答（含推理过程）

  # PTB official evaluate.py 写死读取自身 benchmark 题池，不接受外部 --dev-set。
  # 因此这里不配置 trainer.dev_set；每个 node 的验证反馈由 --dev-limit N 给出，
  # final/test 固定 --limit -1 全量官方评测。
  dev_eval_cmd: >-
    python scripts/posttrainbench_sft_eval.py --mode dev
    --base-model ${PTB_BASE_MODEL:/vepfs-mlp2/c20250602/500050/models/Qwen3-1.7B-Base}
    --ptb-task-dir ${PTB_TASK_DIR:/vepfs-mlp2/c20250602/500050/lh/xqf/PostTrainBench/src/eval/tasks/gsm8k}
    --dev-limit ${PTB_DEV_LIMIT:150}
    --benchmark ${PTB_BENCHMARK:gsm8k}
  test_eval_cmd: >-
    python scripts/posttrainbench_sft_eval.py --mode test
    --ptb-task-dir ${PTB_TASK_DIR:/vepfs-mlp2/c20250602/500050/lh/xqf/PostTrainBench/src/eval/tasks/gsm8k}
    --benchmark ${PTB_BENCHMARK:gsm8k}
  timeout_sec: 1200                                             # 流水线执行（纯数据合成）超时
  train_timeout_sec: 16200                                       # 单次 SFT + PTB dev/test 评测超时

# Phase-2 慢反馈：诊断
diagnostic:
  max_bad_cases: 30
