# Default workflow: fixed raw data -> PipelineAgent -> ReviewAgent feedback.
# No RecipeAgent, external-data MCP, MCTS, Tier-2, training, or benchmark evaluation.

project:
  workspace_dir: ${DF_WORKSPACE:./workspace_review_only}
  # Reuse the prepared DataFlow source and dataflow-dev skill in this directory.
  agent_root: ${DF_AGENT_ROOT:./workspace/_agent_root}
  # Required. The loop refuses to fall back to from-scratch synthesis.
  input_dir: ${RAW_DATA_DIR:}
  input_entry: ${RAW_DATA_ENTRY:}
  # Use a fresh name for every run; existing non-empty run directories are rejected.
  run_name: ${DF_RUN_NAME:review_only}

task:
  # Fixed contract; the entry point never infers the output schema.
  target_schema:
    instruction: str
    output: str
  quality_criteria:
    - 内容正确且与任务相关
    - 输出字段完整、可解析
    - 数据具有足够难度和多样性

llm:
  backend: api
  api:
    api_url: ${DF_API_URL:}
    model_name: ${DF_REVIEW_MODEL:gpt-5.5}
    api_key: ${DF_API_KEY:}
    max_workers: 100
  pipeline_llm:
    generation:
      model_name: ${DF_PIPELINE_MODEL:gpt-4o}
    reasoning:
      model_name: ${DF_PIPELINE_MODEL:gpt-4o}

# PipelineAgent runtime. Both backends receive the same prompt and must write the
# same pipeline.py + decision.json artifacts.
agent:
  backend: ${AGENT_BACKEND:claude}  # claude | opencode
  model: ${DF_AGENT_MODEL:claude-opus-4-8}
  # Claude-specific reasoning effort. OpenCode uses opencode.variant below.
  effort: ${DF_AGENT_EFFORT:max}
  permission_mode: bypassPermissions
  setting_sources: [project]
  max_turns: 50
  pipeline_filename: pipeline.py
  max_retries: 4
  retry_base_delay: 10
  run_timeout_sec: 1800
  resume_on_retry: true
  opencode:
    binary: ${OPENCODE_BIN:opencode}
    # Empty means: reuse agent.model. Add a provider prefix for non-Anthropic models.
    model: ${OPENCODE_MODEL:}
    provider: ${OPENCODE_PROVIDER:anthropic}
    api_key_env: ${OPENCODE_API_KEY_ENV:ANTHROPIC_API_KEY}
    # Empty means: use ANTHROPIC_BASE_URL when provider=anthropic.
    base_url: ${OPENCODE_BASE_URL:}
    variant: ${OPENCODE_VARIANT:}
    max_steps: ${OPENCODE_MAX_STEPS:50}
    mcp_timeout_ms: ${OPENCODE_MCP_TIMEOUT_MS:30000}

generation:
  # 0 means: process the fixed raw corpus without imposing a synthetic sample target.
  target_samples: ${DF_TARGET_SAMPLES:0}

loop:
  # Total number of candidates, including node_0.
  max_iterations: ${DF_MAX_ITERATIONS:4}
  execution_timeout_sec: ${DF_EXECUTION_TIMEOUT_SEC:1200}
  # Only runtime crashes get an immediate code-repair retry. Review feedback always
  # advances to the next iteration, so the feedback loop remains directly observable.
  execution_retries: 1
  python_exe: ${DF_AGENT_PYTHON:}

review:
  sample_size: ${DF_REVIEW_SAMPLE_SIZE:80}
  sample_seed: 42
  schema_threshold: 0.6
  relevance_threshold: 0.6
  null_threshold: 0.5
  hard_metrics: true
  weights:
    correctness: 0.35
    relevance: 0.20
    difficulty: 0.15
    diversity: 0.15
    schema: 0.15
  decontamination:
    reference_files: []
    ngram: 8
    max_rate: 0.01
  # Optional deterministic dataset-level review. It compares a fixed-size sample of
  # each candidate with a high-quality proxy set using DAS = -RBF-MMD. DAS remains
  # separate from the 0-1 LLM review_score; its structured evidence is fed directly
  # to the next PipelineAgent prompt.
  dataset_quality:
    enabled: ${DF_DAS_ENABLED:false}
    sample_size: ${DF_DAS_SAMPLE_SIZE:5000}
    sample_seed: ${DF_DAS_SAMPLE_SEED:42}
    require_full_sample: true
    rbf_sigma: 1.0
    biased: true
    normalize_embeddings: true
    max_embedding_fail_rate: 0.02
    cache_dir: ${DF_DAS_CACHE_DIR:}
    candidate:
      user_field: instruction
      assistant_field: output
    proxy:
      # Runtime is local-only. Prepare the proxy snapshot under data/ before launch.
      source: ${DF_DAS_PROXY_SOURCE:local}
      path: ${DF_DAS_PROXY_PATH:./data/ODA-Math-460k}
      name: ${DF_DAS_PROXY_NAME:}
      split: ${DF_DAS_PROXY_SPLIT:train}
      user_field: question
      assistant_field: response
    embedding:
      model_name: ${DF_DAS_EMBEDDING_MODEL:./model/Qwen3-Embedding-8B}
      base_url: ${DF_DAS_EMBEDDING_URL:http://127.0.0.1:8000/v1}
      api_key: ${DF_DAS_EMBEDDING_API_KEY:EMPTY}
      max_concurrent_requests: ${DF_DAS_EMBEDDING_CONCURRENCY:128}
      max_retries: 3
      truncate_prompt_tokens: 40960
      truncation_side: right

init:
  reference_pipeline: ""
  instruction: ""
