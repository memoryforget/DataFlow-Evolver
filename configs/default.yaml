# DataFlow-Evolve 默认配置
# 支持 ${ENV_VAR} 或 ${ENV_VAR:default} 形式的环境变量展开（见 utils/config.py）

project:
  workspace_dir: ./workspace
  agent_root: ./workspace/_agent_root      # Agent SDK 的 cwd；内含 .claude/skills + dataflow 源码副本
  seed_data: ./data/seed.jsonl             # 种子样例数据（jsonl）

# 非-SDK 模型后端
llm:
  backend: api                             # api | vllm
  api:                                     # 辅助 Agent（Profiler/Review/Diagnostic）用；可上更强模型
    api_url: http://123.129.219.111:3000/v1/chat/completions   # 完整端点：DataFlow APILLMServing_request 逐字 POST（base /v1 是 404）；非-SDK serving 会自动剥成 base 再由 openai 客户端补回
    model_name: gpt-5.5
    api_key: ${DF_API_KEY:}   # 通过环境变量注入；或直接写明文密钥（不推荐提交）
    max_workers: 100
  # 生成的 pipeline【算子运行时】LLM（数据合成用），与上面的辅助 Agent 解耦。
  # 按用途区分多个 serving：每个算子根据自身功能绑定对应 serving。
  # 省略的字段逐字段回退到 api 段；整段删掉=行为与旧版一致（全部用 api）。
  pipeline_llm:
    generation:                              # 题目/数据生成类算子
      model_name: gpt-5.5
    reasoning:                               # 推理/解题/CoT 类算子
      model_name: deepseek-v4-pro
  vllm:
    hf_model_name_or_path: ${VLLM_MODEL:Qwen/Qwen2.5-7B-Instruct}
    tensor_parallel_size: 1

# PipelineAgent 使用的 Claude Agent SDK
agent_sdk:
  model: claude-opus-4-8
  effort: max                              # Claude 努力/思考档位 low|medium|high(默认)|xhigh(仅Opus4.7)|max；
  permission_mode: bypassPermissions       # 无头自动化
  setting_sources: [project]               # 从 cwd/.claude 加载技能
  skills: [dataflow-dev]                    # 经 setting_sources(project)+.claude/skills 自动发现；generating-dataflow-pipeline 不再强制使用
  max_turns: 50                            # 单次 SDK 运行最大轮数（MCP发现+读源码+写pipeline+自测修复，需要更多轮次）
  pipeline_filename: pipeline.py           # 约定：Agent 把流水线写到 <node_id>/pipeline.py
  # 瞬时错误（429/5xx/连接/超时）鲁棒性：指数退避重试 + 单次运行超时
  max_retries: 4                           # SDK 瞬时错误的最大尝试次数（含首次）；永久错误(CLI缺失/鉴权)不重试
  retry_base_delay: 10                     # 首次重试等待秒数，之后指数递增（10/20/40s...）
  run_timeout_sec: 1800                    # 单次 SDK 运行超时(秒)；超时按可重试错误处理，避免挂起时无限阻塞主循环
  resume_on_retry: true                    # 重试时若上次已建立会话则 resume 续跑(不重跑已完成的 turn)；上次没建起会话则全新重跑
  # 工具：用 claude_code 预设放开全部内置工具（见 llm/agent_sdk.py），不再设白名单
  # 系统提示：保留 claude_code 预设，仅 append DataFlow 指令；可用 system_prompt_append 覆盖该 append 文本

# 数据生成规模：注入生成 prompt，指导算子产出量（合成式据此设 num_samples，转换式控采样/过滤）
generation:
  target_samples: 800                      # 目标产出条数（0=不指定）；按下游 SFT 需求调，Condor 建议 <5000
  # probe_samples:（PostTrainBench 两段式新增，可选）搜索期每节点探针产出条数（如 200）。
  #   设置后 search.reward_source=review 时，搜索执行注入 DF_TARGET_SAMPLES=probe_samples，
  #   终选重产注入 DF_TARGET_SAMPLES=target_samples（同一 pipeline.py 复用两档规模）。默认未设=沿用 target_samples。

# 强基线锚点（相对增益奖励 / 池阈值；见 docs/design-decisions.md §2）
# ✅ 已接入 main.py。锁定决策：Δ=0（node>baseline 即正向）、seed=42、只跑一次基线。
# enabled=true 时启动会先跑一次基线（消耗真实 API 预算），故默认关闭。
baseline:
  enabled: false                  # true=warm start（baseline 作 root + Relative Gain 奖励 + τ≥基线）；false=冷启动（虚拟空根，供独立性消融）
  reward_mode: absolute           # 说明：实际模式由 enabled 决定（暖=relative_to_baseline / 冷=absolute）；此项仅文档化意图
  margin: 0.0                     # Δ：node_dev − baseline_dev > margin 视为正向（已定 0）
  seed: 42                        # 固定随机种子，基线只跑一次得稳定 baseline_dev_score
  # 基线产物的评测复用 trainer.dev_eval_cmd；换领域时须让基线在同一目标领域产数据
  baseline_pipeline: workspace/_agent_root/dataflow/statics/pipelines/api_pipelines/reasoning_math_baseline_pipeline.py

# MCTS 树搜索
search:
  # reward_source:（PostTrainBench 两段式新增）每节点 reward 来源。默认 train=沿用现状
  #   （每节点跑 trainer.dev_eval_cmd 做 SFT+评测取真分，数学 SFT 路径不变）。
  #   review=Tier-1：每节点只产 generation.probe_samples 条交 ReviewAgent 打复合分作 reward
  #   （搜索期不训练/不占 GPU），搜索结束再对 top-K 重产 target_samples 做真实 SFT+评测选模。
  # reward_source: train
  # 以下三项仅 reward_source=review 生效：
  # time_budget_sec:  整轮（搜索+终选+终评）总墙钟预算秒；0=只按 max_iterations 停。
  #                   搜索会预留「终选+终评」时间后停止扩展。
  # tier2_top_k:      终选按 tier1 取 top-K 做真实 SFT+评测（默认 3）；预算不足自动缩减（极端 K=1）。
  # tier2_per_run_sec / final_eval_reserve_sec: 单次 Tier-2 与终评的时间估计（默认取 train_timeout_sec），用于预算预留与 K 缩减。
  exploration_constant: 1.414
  exploration_decay: 1.0                    # 探索常数 c 的指数衰减率（按已评估节点数）；1.0=不衰减
  exploration_min: 0.0                      # 衰减下限，防 c 衰减到 0
  max_iterations: 10
  max_children_per_node: 4
  self_correction_retries: 5               # 流水线执行崩溃后的自修正重试次数
  review_self_correction_retries: 5        # Phase-1 评审打回后的自修正重试次数（看中间 step 产物定位、修复、重审）
  # Agent 基础设施失败熔断（区别于流水线质量失败：不惩罚节点、不消耗迭代预算）
  max_consecutive_infra_failures: 5        # 连续基础设施失败达到此数则主动终止（疑似代理/网络不可用）
  infra_backoff_sec: 30                    # 每次基础设施失败后、重试本轮前的退避秒数
  checkpoint: "./workspace/checkpoint.json"                           # 断点续跑：非空=每轮落盘树状态到该路径，启动时存在则载入续跑；空=关闭

# Phase-1 快反馈：数据评审
review:
  schema_threshold: 0.6
  relevance_threshold: 0.6
  sample_size: 40
  # 以下为 PostTrainBench Tier-1 升级新增（可选；不设=仅用 schema/relevance 两维，行为不变）：
  # hard_metrics: true            # 是否启用硬指标惩罚（dup_rate/null_rate/parse_valid_rate 扫全份文件）
  # sample_seed:                  # 蓄水池采样随机种子（复现用；不设=非确定）
  # weights:                      # 五维复合分固定权重（缺项回退默认；下为默认值）
  #   correctness: 0.35
  #   relevance: 0.20
  #   difficulty: 0.15
  #   diversity: 0.15
  #   schema: 0.15
  # collapse_dup_rate: 0.5        # 终选安全阀：放大重产后 dup_rate 超过此值判质量塌陷（跳过用次优）
  # collapse_null_rate: 0.3       # 同上，null_rate 上限
  # collapse_parse_valid_rate: 0.7  # 同上，parse_valid_rate 下限
  # collapse_tier1_frac: 0.6      # 同上，tier1 相对探针回退到此比例以下判塌陷

# Phase-2 真实训练：外部脚本桥接
trainer:
  # train 环境的 python 路径（df-train；负责 SFT）
  # 留空则使用当前环境的 python
  train_python: /vepfs-mlp2/c20250602/500050/lh/xqf/miniconda3/envs/df-train/bin/python
  # eval 环境的 python 路径（df-eval；负责 vLLM benchmark 评测）
  # 留空则在 train 进程内直接评测（仅适合同环境开发/调试）
  eval_python: /vepfs-mlp2/c20250602/500050/lh/xqf/miniconda3/envs/df-eval/bin/python
  # 防数据泄露纪律（见 docs/design-decisions.md §3）：
  #   dev：仅给 MCTS 当奖励信号，允许被「刷」；test：全程对 loop 不可见，仅终评一次。
  dev_eval_cmd: python scripts/llamafactory_math_sft_eval.py --mode dev     # Full SFT + MATH train 评测（默认抽样 500 题，MATH_TRAIN_SAMPLE_SIZE=0 跑全量 7500）
  test_eval_cmd: python scripts/llamafactory_math_sft_eval.py --mode test   # 终评：完整 benchmark suite（GSM8K/AIME/MATH500/AMC23/OlympiadBench/CHMath/Gaokao/Kaoyan/GradeSchool/MinervaMath/GPQA）
  timeout_sec: 7200                                             # 流水线执行（纯数据合成）超时=2h；4算子约30min，5算子(交叉验证+精修)会超1h，留足余量
  train_timeout_sec: 28800                                      # dev/test 评测（含内层 Full SFT 训练 6h + benchmark suite 评测）超时=8h
  # 训练调度方式：
  #   local（默认）：编排器在本机拉起训练子进程，阻塞等待（单机）。
  #   ssh：编排器只在 node0 拉起一次训练脚本；脚本内部完成 convert_dataset、
  #        经免密 SSH 拉起 node1 worker、双机 torchrun 训练，以及 rank0 单机评测。
  dispatch: ssh
  # dispatch=ssh 时的双机参数：
  ssh:
    node1_host: "30300"          # node1 的 SSH 目标（如 user@10.0.0.2 或 ~/.ssh/config 里的别名）
    master_addr: 198.19.158.245       # node0 对 node1 可路由的 IP（torchrun rendezvous 主地址）
    master_port: 29500
    nnodes: 2
    gpus_per_node: 8                    # 每机 GPU 数（脚本内 NPROC_PER_NODE=gpus_per_node*nnodes//nnodes）
    remote_cwd: /vepfs-mlp2/c20250602/500050/lh/xqf/DataFlow-Evolver         # node1 上项目根目录（共享 FS 通常与本机同路径）；留空=编排器 cwd
    ssh_opts: ""                        # 额外 ssh 选项，如 "-i ~/.ssh/id_rsa -p 22"

# Phase-2 慢反馈：诊断
diagnostic:
  max_bad_cases: 30

# 全局数据池（可选副产品；与 MCTS 奖励解耦，见 docs/design-decisions.md §4）
# ✅ 已接入 main.py：运行期暂存 → dump 前统一[门槛筛→去重→占比裁剪]。
# 门槛：暖启动 node_dev > baseline_dev+margin（严格）；冷启动 node_dev ≥ max(本轮分位数, score_threshold)。
data_pool:
  enabled: true                  # 已接入 main.py：true=启动即建 DataPool 累积高质量数据；置 false 关闭（做独立性消融/省算力时）。开启前建议先做受控实验（等量对比+多样性量化）
  score_threshold: 0.0            # 冷启动绝对地板（与分位数取 max；0=不设地板，纯靠分位数+review.passed）
  quantile: 0.5                   # 冷启动分位数门槛（0.5=中位数；尺度无关，跨 benchmark 不重调）
  max_pool_fraction_per_pipeline: 0.3   # 单 pipeline 占池上限 30%；来源数 <⌈1/f⌉(=4) 时不生效
  max_rows_per_pipeline: 0        # 可选叠加绝对行数上限，0=不限
  dedup: content_hash             # 已定：精确去重起步。embedding 语义去重推后（与 bad-case 上采样冲突，未实现）
  output_path: ./workspace/data_pool.jsonl
