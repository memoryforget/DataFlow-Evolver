[project]
name = "dataflow-evolve"
version = "0.1.0"
description = "多智能体、MCTS 驱动的自动数据工程框架（双反馈环）"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0",
    "pyyaml>=6.0",
    "pydantic>=2.0",
]

# 注意：本地 DataFlow 包需单独安装（editable），见 README。
# 它会引入 torch/transformers 等重依赖，故不放进本项目的 dependencies。

[project.optional-dependencies]
dev = ["pytest>=7.0"]
agent = [
    # claude-agent-sdk 依赖 mcp -> pydantic>=2.11，与 llamafactory 冲突
    # 编排层单独装，不要和 train 混装
    "claude-agent-sdk>=0.2",
]
train = [
    # --- 核心：先 pin torch，其他围绕它选 ---
    "torch>=2.5.0,<2.6",
    "torchaudio>=2.5.0,<2.6",
    # --- 训练框架（transformers/tokenizers/accelerate/datasets 由 llamafactory 管理） ---
    "llamafactory>=0.9.5,<0.10",
    "deepspeed>=0.15.0,<0.17",
    # --- 推理 ---
    "vllm>=0.6.6,<0.7",
    # --- 工具 ---
    "math-verify>=0.5",
    "numpy>=1.26,<2",
    # --- 数学评测：答案等价判定（LIMO grader 依赖） ---
    "sympy>=1.12",
    "latex2sympy2>=1.9",
    "regex>=2023.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["dataflow_evolve*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
