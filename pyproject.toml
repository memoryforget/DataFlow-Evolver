[project]
name = "dataflow-evolver"
version = "0.1.0"
description = "多智能体、MCTS 驱动的自动数据工程框架（双反馈环）"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0",
    "pyyaml>=6.0",
    "pydantic>=2.0",
]

# 注意：DataFlow 源码以 vendored 方式置于 workspace/_agent_root/dataflow（非 pip 安装），
# 但**运行**它生成的流水线仍需其第三方依赖，见 optional-dependencies 的 agent-runtime 组。

[project.optional-dependencies]
dev = ["pytest>=7.0"]
agent = [
    # claude-agent-sdk 依赖 mcp -> pydantic>=2.11，与 llamafactory 冲突
    # 编排层单独装，不要和 SFT / eval 混装
    "claude-agent-sdk>=0.2",
]
external-data = [
    # --- dataset-search / data-discovery 两台 in-process MCP（`agent_sdk.external_data: true`）---
    # 这些工具跑在编排器进程里，所以装在 df-agent。全部惰性导入：缺哪个只让对应工具返回一条
    # 说明，不影响主循环，因此本组是可选的。
    "huggingface_hub>=1.0",       # HF 搜索 / 元信息；1.x 起 list_datasets 不再接受 direction
    "datasets>=4.0",              # 两个 hub 的流式读取都经由它
    "requests>=2.31",             # data-discovery 三个工具（Serper / GitHub / arXiv）
    # ModelScope：国内 HF 直连不通时的取数通道。
    # **不要写成 `modelscope[datasets]`**——那个 extra 把 datasets 钉在 <=4.8.4，会把上面这条
    # 降级掉，连带影响 HF 侧与 vendored DataFlow。下面三个是实测跑通 MsDataset 流式加载所需的
    # 最小补集（modelscope 核心包不声明它们，只在 [datasets] extra 里带）。
    "modelscope>=1.39",
    "addict",                     # modelscope.utils.config 顶层 import
    "simplejson>=3.3",            # modelscope.fileio.format.jsonplus
    "sortedcontainers>=1.5.9",    # 同上
]
agent-runtime = [
    # --- 运行 vendored DataFlow 流水线所需（装在 df-agent 环境）---
    # torch 仅为满足导入，df-agent 不做 GPU 计算 —— 装 CPU-only 轮子即可（~200MB 而非 ~2.5GB）：
    #   pip install torch --index-url https://download.pytorch.org/whl/cpu
    "torch>=2.5",
    "transformers>=5.6",
    "huggingface_hub>=1.0",
    "librosa>=0.11",              # localmodel_lalm_serving 顶层 import
    "google-api-python-client>=2.0",  # google_api_serving 顶层 from googleapiclient import discovery
    "google-cloud-aiplatform>=1.55",  # api_google_vertexai_serving 在模块级硬 raise ImportError
    "google-cloud-bigquery>=3.0",
    "google-genai>=1.0",
    "fsspec>=2024.0",
    "pillow>=10.0",
    # 存储 / API serving / 日志
    "requests>=2.31",
    "pandas>=2.0",
    "colorlog>=6.0",
    "rich>=13.0",
    "nltk",
    "spacy",
    "presidio-analyzer",
    "presidio-anonymizer",
    "langkit",
    "fasttext",                   # 无轮子时从源码编译，pip 会自动取 pybind11
    "datasets",
    "evaluate",
    "math-verify",
    "tiktoken",
    "trafilatura",
    "chonkie",
    "PyMySQL",
    "PyMuPDF",
    "pypdf",
    "rapidfuzz",
    "datasketch",
    "simhash",
    "xxhash",
    "word2number",
    "contractions",
    "symspellpy",
    "vendi-score",
    "colorama",
    "appdirs",
    "json5",
    # langkit 内部仍 import pkg_resources，该模块在 setuptools 81+ 已移除
    "setuptools<81",
]
df-train = [
    # --- SFT 环境：双机训练栈，不混装 vLLM / benchmark grader ---
    "torch>=2.5.0,<2.6",
    "torchaudio>=2.5.0,<2.6",
    "torchvision>=0.20.0,<0.21",
    "llamafactory>=0.9.5,<0.10",
    "deepspeed>=0.15.0,<0.17",
    # 显式钉住 tokenizer 栈，避免 train/eval 导出的 tokenizer 元数据格式漂移
    "transformers>=5.6.0,<5.7",
    "tokenizers>=0.22.2,<0.23",
    # 训练侧基础库
    "numpy>=1.26,<2",
]
serving-vllm = [
    # 可选：仅当把辅助 Agent（Profiler/Review/Diagnostic）的 llm.backend 设为 vllm 时才需要。
    # 默认 backend=api 只用 openai（核心依赖），无需安装本组。serving.py 为惰性 import，未装不报错。
    "vllm>=0.19",
    "transformers>=4.57",
]
df-eval = [
    # --- vLLM 评测环境：单机推理与数学 benchmark，不混装训练栈 ---
    # vLLM 0.19.1：DP>1 通过 vllm serve 模式（自动启动 OpenAI API server）
    "torch>=2.10.0,<2.11",
    "vllm>=0.19.1,<0.20",
    "transformers>=4.57.0,<5",
    "tokenizers>=0.22.2,<0.23",
    "numpy>=2.0",
    # 数学答案抽取 / 等价判定
    "sympy",
    "latex2sympy2==1.9.1",
    "regex>=2023.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["dataflow_evolver*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
