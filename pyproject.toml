[project]
name = "dataflow-evolver"
version = "0.1.0"
description = "多智能体、MCTS 驱动的自动数据工程框架（双反馈环）"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0",
    "pyyaml>=6.0",
    "pydantic>=2.0",
]

# 注意：本地 DataFlow 包需单独安装（editable），见 README。
# 它会引入 torch/transformers 等重依赖，故不放进本项目的 dependencies。

[project.optional-dependencies]
dev = ["pytest>=7.0"]
agent = [
    # claude-agent-sdk 依赖 mcp -> pydantic>=2.11，与 llamafactory 冲突
    # 编排层单独装，不要和 SFT / eval 混装
    "claude-agent-sdk>=0.2",
]
df-train = [
    # --- SFT 环境：双机训练栈，不混装 vLLM / benchmark grader ---
    "torch>=2.5.0,<2.6",
    "torchaudio>=2.5.0,<2.6",
    "torchvision>=0.20.0,<0.21",
    "llamafactory>=0.9.5,<0.10",
    "deepspeed>=0.15.0,<0.17",
    # 显式钉住 tokenizer 栈，避免 train/eval 导出的 tokenizer 元数据格式漂移
    "transformers>=5.6.0,<5.7",
    "tokenizers>=0.22.2,<0.23",
    # 训练侧基础库
    "numpy>=1.26,<2",
]
df-eval = [
    # --- vLLM 评测环境：单机推理与数学 benchmark，不混装训练栈 ---
    # vLLM 0.19.1：DP>1 通过 vllm serve 模式（自动启动 OpenAI API server）
    "torch>=2.10.0,<2.11",
    "vllm>=0.19.1,<0.20",
    "transformers>=4.57.0,<5",
    "tokenizers>=0.22.2,<0.23",
    "numpy>=2.0",
    # 数学答案抽取 / 等价判定
    "sympy",
    "latex2sympy2==1.9.1",
    "regex>=2023.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["dataflow_evolver*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
