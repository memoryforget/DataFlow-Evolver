[project]
name = "dataflow-evolver"
version = "0.1.0"
description = "Fixed-corpus DataFlow pipeline evolution with direct ReviewAgent feedback"
requires-python = ">=3.10"
dependencies = [
    "open-dataflow==1.0.10",
    "numpy>=1.24",
    "openai>=1.0",
    "pyyaml>=6.0",
    "pydantic>=2.0",
]

# DataFlow runtime and its transitive dependencies are provided by open-dataflow.

[project.optional-dependencies]
dev = ["pytest>=7.0"]
dataset-quality = [
    # Loads the locally prepared Parquet proxy snapshot used by DAS.
    "datasets>=2.19",
]
agent = [
    # claude-agent-sdk 依赖 mcp -> pydantic>=2.11，与 llamafactory 冲突
    # 编排层单独装，不要和 SFT / eval 混装
    "claude-agent-sdk>=0.2",
]
serving-vllm = [
    # 可选：仅当把 ReviewAgent 的 llm.backend 设为 vllm 时才需要。
    # 默认 backend=api 只用 openai（核心依赖），无需安装本组。serving.py 为惰性 import，未装不报错。
    "vllm>=0.19",
    "transformers>=4.57",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["dataflow_evolver*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
