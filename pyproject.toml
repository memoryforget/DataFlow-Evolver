[project]
name = "dataflow-evolve"
version = "0.1.0"
description = "多智能体、MCTS 驱动的自动数据工程框架（双反馈环）"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0",
    "pyyaml>=6.0",
    "pydantic>=2.0",
]

# 注意：本地 DataFlow 包需单独安装（editable），见 README。
# 它会引入 torch/transformers 等重依赖，故不放进本项目的 dependencies。

[project.optional-dependencies]
dev = ["pytest>=7.0"]
agent = [
    # claude-agent-sdk 依赖 mcp -> pydantic>=2.11，与 llamafactory 冲突
    # 编排层单独装，不要和 train 混装
    "claude-agent-sdk>=0.2",
]
train = [
    # --- 核心：先 pin torch，其他围绕它选 ---
    "torch>=2.5.0,<2.6",
    "transformers>=4.49.0,<4.53",
    "accelerate>=1.2.0,<1.8",
    "datasets>=2.21.0,<3.7",
    "tokenizers>=0.21.0,<0.22",
    # --- 训练框架（trl/peft 由 llamafactory 管理） ---
    "llamafactory>=0.9.3,<0.9.4",
    "deepspeed>=0.15.0,<0.17",
    # --- 推理 ---
    "vllm>=0.6.6,<0.7",
    # --- 工具 ---
    "math-verify>=0.5",
    "numpy>=1.26,<2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["dataflow_evolve*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
